[toolchain]
anchor_version = "0.32.1"
solana_version = "2.3.0"

[features]
resolution = false
skip-lint = false

[programs.localnet]
ghost_markets = "5o9DeQkYHXM3DQkzo16mAt6doaYrfhq3Q5aabWMfMy2n"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "target/localnet-wallet.json"

[workspace]
members = ["programs/ghost-markets"]

[scripts]
test = "node --test tests/localnet.integration.mjs"

[test]
startup_wait = 15000
shutdown_wait = 2000
upgradeable = true
