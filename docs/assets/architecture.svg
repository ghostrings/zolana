<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">GHOST system context</title><desc id="desc">Existing application, synthetic lab and public Intelligence are distinct. Custom Ring integration is future work.</desc><defs><radialGradient id="glow"><stop offset="0" stop-color="#222"/><stop offset="1" stop-color="#080808"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#969696"/></marker></defs><rect width="1200" height="720" rx="20" fill="#080808"/><rect x="1" y="1" width="1198" height="718" rx="19" fill="none" stroke="#353535"/><text x="46" y="43" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="700" fill="#929292" text-anchor="start">GHOST / ENGINEERING</text><text x="46" y="88" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="700" fill="#f4f4f4" text-anchor="start">Three paths. Explicit trust boundaries.</text><text x="46" y="122" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#b8b8b8" text-anchor="start">Current application code vs. local research and a future integration.</text><path d="M46 145L1154 145" fill="none" stroke="#969696" stroke-width="2"/><text x="46" y="182" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="700" fill="#929292" text-anchor="start">01</text><text x="82" y="182" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700" fill="#f4f4f4" text-anchor="start">EXISTING PLATFORM</text><text x="420" y="182" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="700" fill="#929292" text-anchor="start">02</text><text x="456" y="182" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700" fill="#f4f4f4" text-anchor="start">RESEARCH LAB</text><text x="794" y="182" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="700" fill="#929292" text-anchor="start">03</text><text x="830" y="182" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700" fill="#f4f4f4" text-anchor="start">INTELLIGENCE</text><rect x="46" y="201" width="340" height="98" rx="10" fill="#111111" stroke="#353535"/><text x="62" y="233" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f4f4" text-anchor="start">Launch + Wallet</text><text x="62" y="261" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b8b8b8" text-anchor="start">Browser signs user operations</text><text x="62" y="284" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b8b8b8" text-anchor="start">Existing application code</text><path d="M216 299L216 329" fill="none" stroke="#969696" stroke-width="2" marker-end="url(#arrow)"/><rect x="46" y="332" width="340" height="98" rx="10" fill="#111111" stroke="#353535"/><text x="62" y="364" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f4f4" text-anchor="start">Application routes</text><text x="62" y="392" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b8b8b8" text-anchor="start">Default Ring / desk / swaps</text><text x="62" y="415" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b8b8b8" text-anchor="start">Original validators retained</text><path d="M216 430L216 462" fill="none" stroke="#969696" stroke-width="2" marker-end="url(#arrow)"/><rect x="46" y="465" width="340" height="98" rx="10" fill="#111111" stroke="#353535"/><text x="62" y="497" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f4f4" text-anchor="start">Solana + Meteora</text><text x="62" y="525" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b8b8b8" text-anchor="start">Confidential transfers;</text><text x="62" y="548" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b8b8b8" text-anchor="start">public pool execution</text><rect x="420" y="201" width="340" height="98" rx="10" fill="#111111" stroke="#353535"/><text x="436" y="233" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f4f4" text-anchor="start">GHOST Ring lab</text><text x="436" y="261" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b8b8b8" text-anchor="start">Fictional assets + participants</text><text x="436" y="284" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b8b8b8" text-anchor="start">No keys, RPC or proofs</text><path d="M590 299L590 329" fill="none" stroke="#969696" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="332" width="340" height="98" rx="10" fill="#111111" stroke="#353535"/><text x="436" y="364" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f4f4" text-anchor="start">Synthetic policy engine</text><text x="436" y="392" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b8b8b8" text-anchor="start">Integer ledger + atomic fills</text><text x="436" y="415" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b8b8b8" text-anchor="start">Local model, not cryptography</text><rect x="420" y="465" width="340" height="98" rx="10" fill="#111111" stroke="#353535"/><text x="436" y="497" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f4f4" text-anchor="start">Readiness gate</text><text x="436" y="525" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b8b8b8" text-anchor="start">canTransact = false</text><text x="436" y="548" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b8b8b8" text-anchor="start">No ring program or network</text><rect x="794" y="201" width="360" height="98" rx="10" fill="#111111" stroke="#353535"/><text x="810" y="233" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f4f4" text-anchor="start">GHOST Intelligence</text><text x="810" y="261" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b8b8b8" text-anchor="start">Public and synthetic views</text><text x="810" y="284" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b8b8b8" text-anchor="start">Explicit source separation</text><path d="M974 299L974 329" fill="none" stroke="#969696" stroke-width="2" marker-end="url(#arrow)"/><rect x="794" y="332" width="360" height="98" rx="10" fill="#111111" stroke="#353535"/><text x="810" y="364" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f4f4" text-anchor="start">Public Rings indexer</text><text x="810" y="392" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b8b8b8" text-anchor="start">Public vault observations</text><text x="810" y="415" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b8b8b8" text-anchor="start">Coverage may be partial</text><rect x="794" y="465" width="360" height="98" rx="10" fill="#111111" stroke="#353535"/><text x="810" y="497" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f4f4" text-anchor="start">Synthetic report model</text><text x="810" y="525" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b8b8b8" text-anchor="start">Separate fictional dataset</text><text x="810" y="548" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b8b8b8" text-anchor="start">No live auditor</text><path d="M590 563L590 594" fill="none" stroke="#969696" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="46" y="598" width="1108" height="82" rx="10" fill="#0c0c0c" stroke="#777" stroke-dasharray="8 6"/><text x="64" y="628" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700" fill="#b8b8b8" text-anchor="start">FUTURE / NOT IMPLEMENTED</text><text x="64" y="656" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#f4f4f4" text-anchor="start">Supported Custom Ring SDK + program  •  audited reporting  •  independent review</text></svg>
