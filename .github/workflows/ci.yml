name: Engineering verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Toolchain
        run: node --version && npm --version
      - name: Install locked dependencies
        run: npm ci
      - name: Verify protected baseline, tests and build
        run: npm run verify
      - name: Reproduce synthetic evidence
        run: |
          npm run --silent ghost:demo > evidence/ghost-policy-demo.json
          git diff --exit-code -- evidence/ghost-policy-demo.json
